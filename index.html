<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XtreamHub - Video Platform</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0f0f0f;
            --bg-secondary: #181818;
            --bg-tertiary: #212121;
            --bg-hover: #272727;
            --border-color: #303030;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --text-muted: #717171;
            --accent: #00ff00;
            --accent-hover: #00cc00;
            --danger: #ff4757;
            --success: #00b894;
            --live: #ff0000;
            --purple: #9146ff;
        }
        body { font-family: 'Roboto', Arial, sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; overflow-x: hidden; }

        /* Header */
        .header { height: 56px; background: var(--bg-secondary); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; position: fixed; top: 0; left: 0; right: 0; z-index: 1000; }
        .header-left { display: flex; align-items: center; gap: 16px; }
        .menu-btn { width: 40px; height: 40px; background: transparent; border: none; color: white; cursor: pointer; border-radius: 50%; font-size: 20px; }
        .menu-btn:hover { background: var(--bg-hover); }
        .logo { display: flex; align-items: center; gap: 4px; cursor: pointer; color: white; }
        .logo-icon { font-size: 28px; font-weight: bold; }
        .logo-text { font-size: 20px; font-weight: bold; }
        .logo-text span { color: var(--accent); }
        .header-center { display: flex; flex: 1; max-width: 600px; margin: 0 auto; padding: 0 20px; }
        .search-box { display: flex; flex: 1; }
        .search-input { flex: 1; padding: 10px 16px; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 20px 0 0 20px; color: white; font-size: 14px; outline: none; }
        .search-input:focus { border-color: #1c62b9; }
        .search-btn { width: 60px; background: var(--bg-tertiary); border: 1px solid var(--border-color); border-left: none; border-radius: 0 20px 20px 0; color: white; cursor: pointer; font-size: 16px; }
        .header-right { display: flex; align-items: center; gap: 8px; }
        .user-menu { display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--bg-tertiary); border-radius: 20px; cursor: pointer; color: white; border: none; }
        .user-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; overflow: hidden; }
        .user-avatar img { width: 100%; height: 100%; object-fit: cover; }

        /* Buttons */
        .btn { padding: 10px 20px; border: none; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s; }
        .btn-primary { background: var(--accent); color: black; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-secondary { background: var(--bg-tertiary); color: white; }
        .btn-ghost { background: transparent; color: var(--text-secondary); }
        .btn-ghost:hover { background: var(--bg-hover); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .btn-icon { width: 40px; height: 40px; padding: 0; border-radius: 50%; justify-content: center; }

        /* Sidebar */
        .sidebar { position: fixed; top: 56px; left: 0; width: 240px; height: calc(100vh - 56px); background: var(--bg-secondary); overflow-y: auto; padding: 12px 0; z-index: 100; transition: width 0.3s; }
        .sidebar.collapsed { width: 72px; }
        .sidebar-item { display: flex; align-items: center; gap: 20px; padding: 10px 16px; cursor: pointer; color: var(--text-primary); border-radius: 8px; margin: 0 8px; }
        .sidebar-item:hover { background: var(--bg-hover); }
        .sidebar-item.active { background: var(--bg-hover); }
        .sidebar-icon { font-size: 20px; width: 24px; text-align: center; }
        .sidebar-text { font-size: 14px; white-space: nowrap; }
        .sidebar.collapsed .sidebar-text { display: none; }
        .sidebar.collapsed .sidebar-item { justify-content: center; gap: 0; }
        .sidebar-divider { height: 1px; background: var(--border-color); margin: 12px 16px; }
        .sidebar-section { padding: 8px 16px; font-size: 12px; font-weight: 500; color: var(--text-secondary); text-transform: uppercase; }
        .sidebar.collapsed .sidebar-section { display: none; }

        /* Main Content */
        .main-content { margin-top: 56px; margin-left: 240px; padding: 20px; min-height: calc(100vh - 56px); transition: margin-left 0.3s; padding-right: 80px; }
        .main-content.expanded { margin-left: 72px; }

        /* Section Headers */
        .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .section-title { font-size: 20px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .see-all { color: var(--text-secondary); font-size: 14px; cursor: pointer; }
        .see-all:hover { color: white; }

        /* Category Pills */
        .category-pills { display: flex; gap: 10px; padding: 12px 0; margin-bottom: 20px; overflow-x: auto; }
        .category-pill { padding: 8px 16px; background: var(--bg-tertiary); border: none; border-radius: 8px; color: white; font-size: 14px; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
        .category-pill:hover { background: var(--bg-hover); }
        .category-pill.active { background: var(--accent); color: black; }

        /* Stats */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; margin-bottom: 24px; }
        .stat-card { background: var(--bg-secondary); border-radius: 12px; padding: 14px; text-align: center; }
        .stat-value { font-size: 24px; font-weight: 700; color: var(--accent); }
        .stat-label { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }

        /* Video Grid */
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-bottom: 32px; }
        .video-card { cursor: pointer; transition: transform 0.2s; }
        .video-card:hover { transform: scale(1.02); }
        .video-card .admin-controls { opacity: 0; transition: opacity 0.2s; }
        .video-card:hover .admin-controls { opacity: 1; }
        .video-thumbnail { position: relative; width: 100%; padding-top: 56.25%; background: var(--bg-tertiary); border-radius: 12px; overflow: hidden; }
        .video-thumbnail img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .video-duration { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.9); padding: 2px 6px; border-radius: 4px; font-size: 12px; font-weight: 500; }
        .video-platform { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.8); padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: 500; }
        .video-info { display: flex; gap: 12px; padding: 12px 0; }
        .channel-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--bg-tertiary); display: flex; align-items: center; justify-content: center; font-size: 18px; overflow: hidden; cursor: pointer; flex-shrink: 0; }
        .channel-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .video-details { flex: 1; min-width: 0; }
        .video-title { font-size: 14px; font-weight: 500; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; }
        .video-meta { font-size: 12px; color: var(--text-secondary); }

        /* Shorts Section */
        .shorts-section { margin-bottom: 32px; }
        .shorts-grid { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 12px; }
        .short-card { min-width: 180px; max-width: 180px; cursor: pointer; transition: transform 0.2s; }
        .short-card:hover { transform: scale(1.05); }
        .short-thumbnail { position: relative; width: 100%; padding-top: 177%; background: var(--bg-tertiary); border-radius: 12px; overflow: hidden; }
        .short-thumbnail img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .short-overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 12px; background: linear-gradient(transparent, rgba(0,0,0,0.9)); }
        .short-title { font-size: 13px; font-weight: 500; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .short-views { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }
        .short-badge { position: absolute; top: 8px; left: 8px; background: var(--accent); padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 600; color: black; }

        /* Live Section */
        .live-section { margin-bottom: 32px; }
        .live-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
        .live-card { cursor: pointer; transition: transform 0.2s; position: relative; }
        .live-card:hover { transform: scale(1.02); }
        .live-badge { position: absolute; top: 8px; left: 8px; background: var(--live); padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 4px; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .live-viewers { position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.8); padding: 4px 10px; border-radius: 4px; font-size: 12px; display: flex; align-items: center; gap: 4px; }
        .live-info { display: flex; gap: 12px; padding: 12px 0; }
        .live-title { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
        .live-streamer { font-size: 12px; color: var(--text-secondary); }
        .live-game { font-size: 11px; color: var(--purple); margin-top: 2px; }

        /* Add Card */
        .add-card { background: var(--bg-secondary); border: 2px dashed var(--border-color); border-radius: 12px; min-height: 150px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; }
        .add-card:hover { border-color: var(--accent); background: var(--bg-hover); }
        .add-card-icon { font-size: 36px; margin-bottom: 8px; }
        .add-card-text { color: var(--text-secondary); font-size: 13px; }

        /* Channel Page */
        .channel-banner { width: 100%; height: 160px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 12px; margin-bottom: 20px; overflow: hidden; }
        .channel-banner img { width: 100%; height: 100%; object-fit: cover; }
        .channel-header { display: flex; align-items: flex-start; gap: 20px; margin-bottom: 24px; }
        .channel-avatar-large { width: 120px; height: 120px; border-radius: 50%; background: var(--bg-tertiary); display: flex; align-items: center; justify-content: center; font-size: 48px; overflow: hidden; flex-shrink: 0; border: 4px solid var(--bg-primary); }
        .channel-avatar-large img { width: 100%; height: 100%; object-fit: cover; }
        .channel-info { flex: 1; }
        .channel-name { font-size: 24px; font-weight: bold; margin-bottom: 6px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .channel-handle { color: var(--text-secondary); font-size: 14px; margin-bottom: 10px; }
        .channel-stats { display: flex; gap: 16px; color: var(--text-secondary); font-size: 13px; margin-bottom: 10px; }
        .channel-actions { display: flex; gap: 12px; margin-top: 10px; }
        .channel-tabs { display: flex; border-bottom: 1px solid var(--border-color); margin-bottom: 20px; }
        .channel-tab { padding: 12px 24px; background: none; border: none; color: var(--text-secondary); font-size: 14px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.2s; font-weight: 500; }
        .channel-tab:hover { color: white; }
        .channel-tab.active { color: white; border-bottom-color: var(--accent); }

        /* About Section */
        .about-section { background: var(--bg-secondary); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .about-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .about-description { color: var(--text-secondary); line-height: 1.6; margin-bottom: 16px; }
        .about-info-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
        .about-info-item { display: flex; align-items: center; gap: 10px; padding: 10px; background: var(--bg-tertiary); border-radius: 8px; }
        .about-info-icon { font-size: 20px; }
        .about-info-label { font-size: 11px; color: var(--text-muted); }
        .about-info-value { font-size: 13px; font-weight: 500; }

        /* Empty State */
        .empty-state { text-align: center; padding: 50px 32px; color: var(--text-secondary); }
        .empty-icon { font-size: 56px; margin-bottom: 12px; }
        .empty-title { font-size: 18px; font-weight: 600; margin-bottom: 6px; color: var(--text-primary); }

        /* Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 2000; }
        .modal-overlay.active { display: flex; }
        .modal { background: var(--bg-secondary); border-radius: 12px; width: 90%; max-width: 480px; max-height: 90vh; overflow-y: auto; }
        .modal-lg { max-width: 900px; }
        .modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: var(--bg-secondary); z-index: 1; }
        .modal-title { font-size: 18px; font-weight: 600; }
        .modal-close { width: 32px; height: 32px; background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 22px; border-radius: 50%; }
        .modal-close:hover { background: var(--bg-hover); color: white; }
        .modal-body { padding: 20px; }
        .modal-footer { padding: 16px 20px; border-top: 1px solid var(--border-color); display: flex; gap: 12px; justify-content: flex-end; }

        /* Form */
        .form-group { margin-bottom: 14px; }
        .form-label { display: block; margin-bottom: 6px; color: var(--text-secondary); font-size: 13px; font-weight: 500; }
        .form-input { width: 100%; padding: 10px 14px; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 8px; color: white; font-size: 14px; outline: none; }
        .form-input:focus { border-color: var(--accent); }
        .form-select { width: 100%; padding: 10px 14px; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 8px; color: white; font-size: 14px; outline: none; cursor: pointer; }
        .form-error { color: var(--danger); font-size: 13px; margin-top: 8px; text-align: center; }

        /* Tabs */
        .tabs { display: flex; background: var(--bg-tertiary); border-radius: 8px; margin-bottom: 16px; padding: 4px; }
        .tab { flex: 1; padding: 10px; border: none; background: none; color: var(--text-secondary); cursor: pointer; border-radius: 6px; font-weight: 500; }
        .tab.active { background: var(--bg-primary); color: white; }

        /* Admin */
        .admin-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
        .admin-tab { flex: 1; padding: 10px; background: var(--bg-tertiary); border: none; border-radius: 8px; color: var(--text-secondary); cursor: pointer; font-size: 13px; }
        .admin-tab.active { background: var(--accent); color: black; }
        .admin-list { max-height: 400px; overflow-y: auto; padding: 10px; }
        .admin-item { display: flex; align-items: center; justify-content: space-between; padding: 12px; background: var(--bg-tertiary); border-radius: 8px; margin-bottom: 8px; }
        .admin-item-left { display: flex; align-items: center; gap: 12px; }
        .badge { font-size: 10px; padding: 2px 8px; border-radius: 4px; font-weight: 500; }
        .badge-admin { background: var(--accent); color: black; }
        .badge-banned { background: var(--danger); }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 0 5px; }

        /* Toast */
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--bg-secondary); color: white; padding: 12px 20px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); display: none; align-items: center; gap: 10px; z-index: 3000; }
        .toast.show { display: flex; }
        .toast.success { border-left: 4px solid var(--success); }
        .toast.error { border-left: 4px solid var(--danger); }

        /* Chat Panel */
        .chat-panel { position: fixed; top: 56px; right: 0; width: 280px; height: calc(100vh - 56px); background: var(--bg-secondary); border-left: 1px solid var(--border-color); z-index: 900; transform: translateX(0); transition: transform 0.3s ease; box-shadow: -4px 0 20px rgba(0,0,0,0.3); display: flex; flex-direction: column; }
        .chat-panel.hidden { transform: translateX(280px); }
        .chat-header { padding: 14px; background: var(--bg-tertiary); display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
        .chat-title { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .chat-online { font-size: 11px; color: var(--success); }
        .chat-toggle-btn { background: var(--accent); color: black; border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 14px; position: absolute; left: -40px; top: 10px; display: flex; align-items: center; justify-content: center; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
        .chat-msg { display: flex; gap: 8px; font-size: 12px; }
        .chat-msg-avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 10px; flex-shrink: 0; color: black; }
        .chat-msg-content { flex: 1; }
        .chat-msg-user { color: var(--text-secondary); font-size: 10px; display: flex; align-items: center; gap: 4px; }
        .chat-msg-text { color: white; word-break: break-word; }
        .chat-input-area { padding: 14px; border-top: 1px solid var(--border-color); display: flex; gap: 8px; }
        .chat-input { flex: 1; padding: 8px 12px; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 20px; color: white; font-size: 12px; outline: none; }
        .chat-send { width: 36px; height: 36px; background: var(--accent); border: none; border-radius: 50%; color: black; cursor: pointer; font-size: 14px; }
        .chat-indicator { width: 8px; height: 8px; background: var(--success); border-radius: 50%; display: inline-block; margin-right: 6px; }

        /* Music Player Bar */
        .music-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: var(--bg-secondary); border-top: 1px solid var(--border-color); display: flex; align-items: center; padding: 0 20px; gap: 20px; z-index: 1000; margin-left: 240px; transition: margin-left 0.3s; }
        .main-content.expanded + .music-bar { margin-left: 72px; }
        .music-controls { display: flex; align-items: center; gap: 10px; }
        .music-play-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); border: none; color: black; cursor: pointer; font-size: 16px; }
        .music-info { flex: 1; max-width: 300px; }
        .music-title { font-size: 14px; font-weight: 500; }
        .music-artist { font-size: 12px; color: var(--text-secondary); }
        .music-progress { flex: 1; max-width: 400px; display: flex; align-items: center; gap: 10px; }
        .music-progress-bar { flex: 1; height: 5px; background: var(--bg-tertiary); border-radius: 3px; overflow: hidden; cursor: pointer; }
        .music-progress-fill { height: 100%; width: 0%; background: var(--accent); }
        .music-time { font-size: 12px; color: var(--text-secondary); }

        /* Share & QR */
        .share-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .share-btn { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px; background: var(--bg-tertiary); border: none; border-radius: 8px; color: white; cursor: pointer; font-size: 12px; }
        .share-btn:hover { background: var(--bg-hover); }
        .qr-container { display: flex; justify-content: center; margin: 20px 0; }
        .qr-code { width: 200px; height: 200px; background: white; padding: 10px; border-radius: 8px; }
        .export-import { display: flex; gap: 10px; margin-top: 20px; }

        /* Follow Button */
        .follow-btn { padding: 6px 16px; background: var(--accent); color: black; border: none; border-radius: 20px; font-size: 13px; cursor: pointer; }
        .follow-btn.following { background: var(--bg-tertiary); color: white; }

        /* Responsive */
        @media (max-width: 1024px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; padding-right: 20px; }
            .music-bar { margin-left: 0; }
        }
        @media (max-width: 768px) {
            .header-center { display: none; }
            .video-grid { grid-template-columns: 1fr; }
            .shorts-grid { gap: 8px; }
            .short-card { min-width: 130px; max-width: 130px; }
            .channel-header { flex-direction: column; align-items: center; text-align: center; }
            .channel-avatar-large { width: 80px; height: 80px; font-size: 32px; }
            .chat-panel { width: 240px; }
        }
    </style>
</head>
<body>
    <!-- App -->
    <div id="app">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <button class="menu-btn" onclick="toggleSidebar()">☰</button>
                <div class="logo" onclick="showHome()"><span class="logo-icon">X</span><span class="logo-text">tream<span>Hub</span></span></div>
            </div>
            <div class="header-center">
                <div class="search-box">
                    <input type="text" class="search-input" id="searchInput" placeholder="Search...">
                    <button class="search-btn" onclick="handleSearch()">🔍</button>
                </div>
            </div>
            <div class="header-right" id="headerRight"></div>
        </header>

        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-item active" onclick="showHome()"><span class="sidebar-icon">🏠</span><span class="sidebar-text">Home</span></div>
            <div class="sidebar-item" onclick="showShorts()"><span class="sidebar-icon">⚡</span><span class="sidebar-text">Shorts</span></div>
            <div class="sidebar-item" onclick="showLive()"><span class="sidebar-icon">🔴</span><span class="sidebar-text">Live</span></div>
            <div class="sidebar-item" onclick="showExplore()"><span class="sidebar-icon">🧭</span><span class="sidebar-text">Explore</span></div>
            <div class="sidebar-item" onclick="showChannels()"><span class="sidebar-icon">📺</span><span class="sidebar-text">Channels</span></div>
            <div class="sidebar-divider"></div>
            <div class="sidebar-section">Library</div>

    <script>

        const ADMIN_USER = 'arianxenon', ADMIN_PASS = '2981354361max';
        const COLORS = ['#ff6b6b','#4ecdc4','#45b7d1','#96ceb4','#ffeaa7','#fd79a8','#a29bfe','#00b894','#e17055','#74b9ff'];

        const GAMING_EMOJIS = ['🎮','🕹️','👾','🚀','⚡','🔥','💎','🎯','🏆','🎲','🎪','🌟','💥','🦂','🦾','🎰','🎱','🎖️','🏅','👑'];
        const CATEGORIES = ['All','Gaming','Music','Sports','News','Entertainment'];

        // State
        let currentUser = null, users = [], channels = [], videos = [], shorts = [], lives = [], musicList = [], follows = [], bannedUsers = [];
        let currentPage = 'home', currentChannel = null, activeCategory = 'All', channelTab = 'videos';
        let editingItem = null, editingType = null, currentPlayerItem = null;
        let chatHidden = true, chatMessages = [];
        let musicAudio = null, musicPlaying = false, currentMusicIndex = 0;
        let popupWindow = null;
        let currentEditMusicId = null;

        // Helpers
        const getEmoji = name => { let h=0; for(let i=0;i<name.length;i++) h=name.charCodeAt(i)+((h<<5)-h); return GAMING_EMOJIS[Math.abs(h)%GAMING_EMOJIS.length]; };
        const getAvatar = c => !c?'🎮':c.avatar?`<img src="${c.avatar}">`:getEmoji(c.name);
        const formatNum = n => n>=1000000?(n/1000000).toFixed(1)+'M':n>=1000?(n/1000).toFixed(1)+'K':n;
        const formatDate = t => t?new Date(t).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'Unknown';
        const getPlatformIcon = p => ({youtube:'🔴',twitch:'🟣',aparat:'🎬',kick:'💚'}[p]||'📺');
        const getPlatformName = p => ({youtube:'YouTube',twitch:'Twitch',aparat:'Aparat',kick:'Kick'}[p]||'Platform');
        const extractVideoId = (url, platform) => {
            if(platform === 'youtube') {
                const match = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&]+)/);
                return match ? match[1] : null;
            } else if(platform === 'aparat') {
                const match = url.match(/aparat\.com\/v\/([^\/]+)/);
                return match ? match[1] : null;
            } else if(platform === 'twitch') {
                const match = url.match(/twitch\.tv\/([^\/]+)/);
                return match ? match[1] : null;
            }
            return null;
        };

        function showToast(msg,type='success') {
            const t=document.getElementById('toast'),i=document.getElementById('toastIcon'),m=document.getElementById('toastMsg');
            t.className='toast '+type; i.textContent=type==='success'?'✅':'❌'; m.textContent=msg; t.classList.add('show');
            setTimeout(()=>t.classList.remove('show'),3000);
        }

        // Data
        function loadData() {
            users=JSON.parse(localStorage.getItem('xh-users')||'[]');
            channels=JSON.parse(localStorage.getItem('xh-channels')||'[]');
            const allContent=JSON.parse(localStorage.getItem('xh-videos')||'[]');
            videos=allContent.filter(v=>v.type==='video');
            shorts=allContent.filter(v=>v.type==='short');
            lives=allContent.filter(v=>v.type==='live');
            musicList=JSON.parse(localStorage.getItem('xh-music')||'[]');
            follows=JSON.parse(localStorage.getItem('xh-follows')||'[]');
            bannedUsers=JSON.parse(localStorage.getItem('xh-banned')||'[]');
            
            // Add admin if not exists
            if(!users.find(u=>u.username===ADMIN_USER)) {
                users.push({
                    id:'admin',
                    username:ADMIN_USER,
                    password:ADMIN_PASS,
                    color:'#00ff00',
                    isAdmin:true,
                    isBanned:false,
                    createdAt:Date.now(),
                    social:{}
                });
            }
            const admin=users.find(u=>u.username===ADMIN_USER); 
            if(admin){admin.password=ADMIN_PASS;admin.isAdmin=true;}
            
            const saved=localStorage.getItem('xh-current'); 
            if(saved){const u=users.find(x=>x.id===saved&&!x.isBanned); if(u)currentUser=u;}
            
            // Add sample data if empty
            if(channels.length === 0 && videos.length === 0) {
                addSampleData();
            }
            
            initChat(); 
            render(); 
            initMusicPlayer();
            generateQR();
        }
        
        function addSampleData() {
            // Sample channel
            const sampleChannel = {
                id:'c1',
                name:'Xtream Gaming',
                handle:'@xtreamgaming',
                description:'Best gaming content ever!',
                avatar:'',
                banner:'',
                createdAt:Date.now(),
                createdBy:'admin'
            };
            channels.push(sampleChannel);
            
            // Sample videos
            videos.push({
                id:'v1',
                channelId:'c1',
                title:'Amazing Gaming Moments 2025',
                url:'https://youtube.com/watch?v=dQw4w9WgXcQ',
                category:'Gaming',
                platform:'youtube',
                thumbnail:'',
                duration:'10:30',
                type:'video',
                views:15420,
                createdAt:Date.now()
            });
            
            shorts.push({
                id:'s1',
                channelId:'c1',
                title:'Epic Short Clip',
                url:'https://youtube.com/shorts/dQw4w9WgXcQ',
                category:'Gaming',
                platform:'youtube',
                thumbnail:'',
                type:'short',
                views:5432,
                createdAt:Date.now()
            });
            
            lives.push({
                id:'l1',
                channelId:'c1',
                title:'Live Streaming Now!',
                url:'https://twitch.tv/xtreamgaming',
                category:'Gaming',
                platform:'twitch',
                thumbnail:'',
                game:'Valorant',
                type:'live',
                viewers:234,
                createdAt:Date.now()
            });
        }
        
        function saveData() {
            localStorage.setItem('xh-users',JSON.stringify(users));
            localStorage.setItem('xh-channels',JSON.stringify(channels));
            localStorage.setItem('xh-videos',JSON.stringify([...videos,...shorts,...lives]));
            localStorage.setItem('xh-music',JSON.stringify(musicList));
            localStorage.setItem('xh-follows',JSON.stringify(follows));
            localStorage.setItem('xh-banned',JSON.stringify(bannedUsers));
            if(currentUser) localStorage.setItem('xh-current',currentUser.id);
            else localStorage.removeItem('xh-current');
        }

        // Chat
        function initChat() { 
            chatMessages=JSON.parse(localStorage.getItem('xh-chat')||'[]');
            if(chatMessages.length===0) {
                chatMessages=[
                    {user:'GamerPro',text:'Hey! 👋',color:'#ff6b6b'},
                    {user:'StreamFan',text:'Nice content!',color:'#4ecdc4'},
                    {user:'arianxenon',text:'Welcome to XtreamHub!',color:'#00ff00',isAdmin:true}
                ];
            }
            renderChat(); 
        }
        function renderChat() { 
            const onlineCount = Math.floor(Math.random() * 20) + 10;
            document.getElementById('chatOnline').textContent = `${onlineCount} online`;
            document.getElementById('chatMessages').innerHTML=chatMessages.map((m,i)=>`<div class="chat-msg" id="chatmsg-${i}"><div class="chat-msg-avatar" style="background:${m.color}">${m.user[0]}</div><div class="chat-msg-content"><div class="chat-msg-user">${m.user} ${currentUser?.isAdmin?`<button class="btn btn-sm" style="padding:2px 6px;font-size:9px;background:var(--danger)" onclick="deleteChatMsg(${i})">🗑️</button><button class="btn btn-sm" style="padding:2px 6px;font-size:9px;background:var(--accent)" onclick="banChatUser('${m.user}')">🚫</button>`:''}</div><div class="chat-msg-text">${m.text}</div></div></div>`).join(''); 
            document.getElementById('chatMessages').scrollTop=document.getElementById('chatMessages').scrollHeight; 
        }
        function deleteChatMsg(idx) { 
            if(confirm('Delete this message?')){ 
                chatMessages.splice(idx,1); 
                localStorage.setItem('xh-chat',JSON.stringify(chatMessages));
                renderChat(); 
                showToast('Deleted'); 
            } 
        }
        function banChatUser(username) { 
            if(confirm('Ban user "'+username+'" from chat?')){ 
                const u=users.find(x=>x.username===username); 
                if(u && !u.isAdmin){ 
                    u.isBanned=true; 
                    bannedUsers.push({id:u.id,username:u.username,reason:'Chat ban',bannedBy:currentUser?.username,date:Date.now()});
                } 
                chatMessages=chatMessages.filter(m=>m.user!==username); 
                localStorage.setItem('xh-chat',JSON.stringify(chatMessages));
                saveData();
                renderChat(); 
                showToast(username+' banned from chat'); 
            } 
        }
        function sendChat() { 
            const input=document.getElementById('chatInput'),text=input.value.trim(); 
            if(!text)return; 
            chatMessages.push({user:currentUser?.username||'Guest',text:text,color:currentUser?.color||'#888'}); 
            input.value=''; 
            localStorage.setItem('xh-chat',JSON.stringify(chatMessages));
            renderChat(); 
        }
        function toggleChat() { 
            chatHidden=!chatHidden; 
            document.getElementById('chatPanel').classList.toggle('hidden',chatHidden); 
            document.getElementById('chatToggleBtn').textContent=chatHidden?'◀':'▶'; 
        }

        // Music Player
        function initMusicPlayer() {
            if(musicList.length>0 && !musicAudio) {
                playMusic(0);
            }
        }
        function playMusic(index) {
            if(musicList.length===0) return;
            currentMusicIndex = index;
            const music = musicList[currentMusicIndex];
            if(musicAudio) {
                musicAudio.pause();
                musicAudio = null;
            }
            musicAudio = new Audio(music.url);
            musicAudio.addEventListener('timeupdate', updateMusicProgress);
            musicAudio.addEventListener('ended', playNextMusic);
            musicAudio.play().catch(e => {
                showToast('Error playing music: ' + e.message, 'error');
            });
            musicPlaying = true;
            document.getElementById('musicPlayPause').textContent = '⏸️';
            document.getElementById('musicTitle').textContent = music.title;
            document.getElementById('musicArtist').textContent = music.artist;
            setTimeout(() => {
                document.getElementById('musicDuration').textContent = formatTime(musicAudio.duration) || '0:00';
            }, 1000);
        }
        function toggleMusic() {
            if(!musicAudio && musicList.length>0) {
                playMusic(currentMusicIndex);
            } else if(musicAudio) {
                if(musicPlaying) {
                    musicAudio.pause();
                    document.getElementById('musicPlayPause').textContent = '▶️';
                } else {
                    musicAudio.play();
                    document.getElementById('musicPlayPause').textContent = '⏸️';
                }
                musicPlaying = !musicPlaying;
            }
        }
        function playNextMusic() {
            if(musicList.length===0) return;
            currentMusicIndex = (currentMusicIndex + 1) % musicList.length;
            playMusic(currentMusicIndex);
        }
        function updateMusicProgress() {
            if(musicAudio) {
                const progress = (musicAudio.currentTime / musicAudio.duration) * 100;
                document.getElementById('musicProgress').style.width = progress + '%';
                document.getElementById('musicCurrent').textContent = formatTime(musicAudio.currentTime);
            }
        }
        function seekMusic(e) {
            if(musicAudio) {
                const bar = e.currentTarget;
                const rect = bar.getBoundingClientRect();
                const pos = (e.clientX - rect.left) / rect.width;
                musicAudio.currentTime = pos * musicAudio.duration;
            }
        }
        function formatTime(seconds) {
            if(!seconds || isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2,'0')}`;
        }
        
        // Music CRUD
        function handleAddMusic() {
            if(!currentUser?.isAdmin) {
                showToast('Only admin can add music', 'error');
                return;
            }
            
            const title = document.getElementById('musicTitleInput')?.value.trim();
            const artist = document.getElementById('musicArtistInput')?.value.trim();
            const url = document.getElementById('musicUrlInput')?.value.trim();
            const cover = document.getElementById('musicCoverInput')?.value.trim();
            
            if(!title || !artist || !url) {
                showToast('Title, Artist and URL are required', 'error');
                return;
            }
            
            const newMusic = {
                id: 'm' + Date.now(),
                title: title,
                artist: artist,
                url: url,
                cover: cover || '',
                addedBy: currentUser?.id,
                addedAt: Date.now()
            };
            
            musicList.push(newMusic);
            saveData();
            closeModal('addMusicModal');
            
            // Clear form
            document.getElementById('musicTitleInput').value = '';
            document.getElementById('musicArtistInput').value = '';
            document.getElementById('musicUrlInput').value = '';
            document.getElementById('musicCoverInput').value = '';
            
            if(musicList.length === 1) {
                playMusic(0);
            }
            
            showToast('Music added successfully');
            
            // Refresh admin panel if open
            if(document.getElementById('adminModal').classList.contains('active')) {
                renderAdminMusic();
            }
        }
        
        function deleteMusic(id) {
            if(!currentUser?.isAdmin) {
                showToast('Admin only', 'error');
                return;
            }
            
            if(confirm('Delete this music?')) {
                const index = musicList.findIndex(m => m.id === id);
                
                // Handle playing music
                if(index === currentMusicIndex && musicAudio) {
                    musicAudio.pause();
                    musicAudio = null;
                    
                    if(musicList.length > 1) {
                        if(index === musicList.length - 1) {
                            playMusic(0);
                        } else {
                            playMusic(index);
                        }
                    } else {
                        musicPlaying = false;
                        document.getElementById('musicPlayPause').textContent = '▶️';
                        document.getElementById('musicTitle').textContent = 'No music playing';
                        document.getElementById('musicArtist').textContent = 'Add music from admin panel';
                        document.getElementById('musicProgress').style.width = '0%';
                        document.getElementById('musicCurrent').textContent = '0:00';
                        document.getElementById('musicDuration').textContent = '0:00';
                    }
                }
                
                musicList = musicList.filter(m => m.id !== id);
                saveData();
                
                if(document.getElementById('adminModal').classList.contains('active')) {
                    renderAdminMusic();
                }
                
                showToast('Music deleted');
            }
        }
        
        function editMusic(id) {
            if(!currentUser?.isAdmin) {
                showToast('Admin only', 'error');
                return;
            }
            
            const music = musicList.find(m => m.id === id);
            if(!music) return;
            
            currentEditMusicId = id;
            document.getElementById('editMusicTitle').value = music.title;
            document.getElementById('editMusicArtist').value = music.artist;
            document.getElementById('editMusicUrl').value = music.url;
            document.getElementById('editMusicCover').value = music.cover || '';
            openModal('editMusicModal');
        }
        
        function saveMusicEdit() {
            if(!currentUser?.isAdmin || !currentEditMusicId) return;
            
            const music = musicList.find(m => m.id === currentEditMusicId);
            if(!music) return;
            
            music.title = document.getElementById('editMusicTitle').value.trim();
            music.artist = document.getElementById('editMusicArtist').value.trim();
            music.url = document.getElementById('editMusicUrl').value.trim();
            music.cover = document.getElementById('editMusicCover').value.trim();
            
            if(!music.title || !music.artist || !music.url) {
                showToast('Title, Artist and URL are required', 'error');
                return;
            }
            
            saveData();
            closeModal('editMusicModal');
            
            // Update player if this music is playing
            if(musicList[currentMusicIndex]?.id === currentEditMusicId && musicAudio) {
                const wasPlaying = musicPlaying;
                musicAudio.pause();
                playMusic(currentMusicIndex);
                if(!wasPlaying) {
                    musicAudio.pause();
                    musicPlaying = false;
                    document.getElementById('musicPlayPause').textContent = '▶️';
                }
            }
            
            if(document.getElementById('adminModal').classList.contains('active')) {
                renderAdminMusic();
            }
            
            showToast('Music updated');
        }
        
        function deleteAllMusic() {
            if(!currentUser?.isAdmin) {
                showToast('Admin only', 'error');
                return;
            }
            
            if(confirm('⚠️ Delete ALL music? This cannot be undone!')) {
                if(musicAudio) {
                    musicAudio.pause();
                    musicAudio = null;
                }
                
                musicList = [];
                musicPlaying = false;
                currentMusicIndex = 0;
                
                document.getElementById('musicPlayPause').textContent = '▶️';
                document.getElementById('musicTitle').textContent = 'No music playing';
                document.getElementById('musicArtist').textContent = 'Add music from admin panel';
                document.getElementById('musicProgress').style.width = '0%';
                document.getElementById('musicCurrent').textContent = '0:00';
                document.getElementById('musicDuration').textContent = '0:00';
                
                saveData();
                
                if(document.getElementById('adminModal').classList.contains('active')) {
                    renderAdminMusic();
                }
                
                showToast('All music deleted');
            }
        }

            else if(currentPage==='explore') renderExplore(c);

        function renderHome(c) {

        function shortCard(v) { const ch=channels.find(x=>x.id===v.channelId); return `<div class="short-card" onclick="openPlayer('${v.id}','short')"><div class="short-thumbnail"><img src="${v.thumbnail||DEFAULT_THUMB}" onerror="this.src='${DEFAULT_THUMB}'"><div class="short-badge">SHORT</div>${currentUser?.isAdmin?`<div class="admin-controls" style="position:absolute;top:8px;right:8px;display:flex;gap:4px"><button class="btn btn-sm" style="background:rgba(0,0,0,0.8)" onclick="event.stopPropagation();editContent('${v.id}','short')">✏️</button><button class="btn btn-sm btn-danger" onclick="event.stopPropagation();deleteContent('${v.id}','short')">🗑️</button></div>`:''}<div class="short-overlay"><div class="short-title">${v.title}</div><div class="short-views">${formatNum(v.views||0)} views</div></div></div></div>`; }
        function liveCard(v) { const ch=channels.find(x=>x.id===v.channelId); return `<div class="live-card" onclick="openPlayer('${v.id}','live')"><div class="video-thumbnail"><img src="${v.thumbnail||DEFAULT_THUMB}" onerror="this.src='${DEFAULT_THUMB}'"><div class="live-badge">🔴 LIVE</div><div class="live-viewers">👁️ ${formatNum(v.viewers||Math.floor(Math.random()*10000))}</div>${currentUser?.isAdmin?`<div class="admin-controls" style="position:absolute;top:8px;right:8px;display:flex;gap:4px"><button class="btn btn-sm" style="background:rgba(0,0,0,0.8)" onclick="event.stopPropagation();editContent('${v.id}','live')">✏️</button><button class="btn btn-sm btn-danger" onclick="event.stopPropagation();deleteContent('${v.id}','live')">🗑️</button></div>`:''}</div><div class="live-info"><div class="channel-avatar">${getAvatar(ch)}</div><div><div class="live-title">${v.title}</div><div class="live-streamer">${ch?.name||'Unknown'}</div>${v.game?`<div class="live-game">🎮 ${v.game}</div>`:''}</div></div></div>`; }
        function videoCard(v) { const ch=channels.find(x=>x.id===v.channelId); return `<div class="video-card" onclick="openPlayer('${v.id}','video')"><div class="video-thumbnail"><img src="${v.thumbnail||DEFAULT_THUMB}" onerror="this.src='${DEFAULT_THUMB}'">${v.duration?`<span class="video-duration">${v.duration}</span>`:''}<span class="video-platform">${getPlatformIcon(v.platform)} ${getPlatformName(v.platform)}</span>${currentUser?.isAdmin?`<div class="admin-controls" style="position:absolute;top:8px;right:8px;display:flex;gap:4px"><button class="btn btn-sm" style="background:rgba(0,0,0,0.8)" onclick="event.stopPropagation();editContent('${v.id}','video')">✏️</button><button class="btn btn-sm btn-danger" onclick="event.stopPropagation();deleteContent('${v.id}','video')">🗑️</button></div>`:''}</div><div class="video-info"><div class="channel-avatar" onclick="event.stopPropagation();showChannel('${v.channelId}')">${getAvatar(ch)}</div><div class="video-details"><div class="video-title">${v.title}</div><div class="video-meta">${ch?.name||'Unknown'} • ${formatNum(v.views||0)} views</div></div></div></div>`; }

        // Player Modal - Popup Window
        function openPlayer(id, type) {
            let item;
            if(type==='short')item=shorts.find(x=>x.id===id);
            else if(type==='live')item=lives.find(x=>x.id===id);
            else item=videos.find(x=>x.id===id);
            if(!item)return;
            
            currentPlayerItem=item;
            const ch=channels.find(x=>x.id===item.channelId);
            const isShort=type==='short';
            const isLive=type==='live';
            
            // استخراج ID ویدیو از URL
            const videoId = extractVideoId(item.url, item.platform);
            
            // ساخت iframe embed بر اساس پلتفرم
            let embedUrl = '';
            if(item.platform === 'youtube' && videoId) {
                embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
            } else if(item.platform === 'aparat' && videoId) {
                embedUrl = `https://www.aparat.com/video/video/embed/videohash/${videoId}/vt/frame?autoplay=1`;

                embedUrl = `https://player.twitch.tv/?channel=${videoId}&parent=${window.location.hostname}&autoplay=true`;

            const height = isShort ? 700 : 500;

            const top = (screen.height - height) / 2;
            
            // Generate popup HTML

            <div class="channel-tabs"><button class="channel-tab ${channelTab==='videos'?'active':''}" onclick="channelTab='videos';render()">🎬 Videos</button><button class="channel-tab ${channelTab==='shorts'?'active':''}" onclick="channelTab='shorts';render()">⚡ Shorts</button><button class="channel-tab ${channelTab==='live'?'active':''}" onclick="channelTab='live';render()">🔴 Live</button><button class="channel-tab ${channelTab==='about'?'active':''}" onclick="channelTab='about';render()">ℹ️ About</button></div>`;
            if(channelTab==='videos')html+=cv.length?`<div class="video-grid">${cv.map(v=>videoCard(v)).join('')}</div>`:'<div class="empty-state"><div class="empty-icon">🎬</div><div class="empty-title">No videos</div></div>';

        function toggleBan(id) { 
            const u=users.find(x=>x.id===id); 
            if(u){
                u.isBanned=!u.isBanned;
                if(u.isBanned){
                    bannedUsers.push({id:u.id,username:u.username,reason:'Admin ban',bannedBy:currentUser?.username,date:Date.now()});
                }else{
                    bannedUsers=bannedUsers.filter(b=>b.id!==id);
                }
                saveData();
                renderAdminUsers();
                renderAdminBanned();
                showToast(u.isBanned?'Banned':'Unbanned');
            } 
        }
        
        function unbanUser(id) { 
            const u=users.find(x=>x.id===id); 
            if(u){
                u.isBanned=false;
                bannedUsers=bannedUsers.filter(b=>b.id!==id);
                saveData();
                renderAdminUsers();
                renderAdminBanned();
                showToast('Unbanned');
            } 
        }

        // Modal helpers
        const openModal=id=>document.getElementById(id).classList.add('active');
        const closeModal=id=>{
            document.getElementById(id).classList.remove('active');
            if(id==='editModal'){editingItem=null;editingType=null;}
            if(id==='editMusicModal'){currentEditMusicId=null;}
        };
        const openAddVideoFor=chId=>{
            document.getElementById('videoChannel').innerHTML='<option value="">Select...</option>'+channels.map(c=>`<option value="${c.id}"${c.id===chId?' selected':''}>${c.name}</option>`).join('');
            openModal('addVideoModal');
        };
        const openShareModal=()=>{generateQR();openModal('shareModal');};

        // Search
        function handleSearch() { 
            const q=document.getElementById('searchInput').value.trim().toLowerCase(); 
            if(!q)return; 
            const all=[...videos,...shorts,...lives]; 
            const r=all.filter(v=>v.title.toLowerCase().includes(q)); 
            document.getElementById('pageContent').innerHTML=`
                <h1 style="font-size:22px;margin-bottom:16px">🔍 "${q}"</h1>
                ${r.length?`<div class="video-grid">${r.map(v=>v.type==='short'?shortCard(v):v.type==='live'?liveCard(v):videoCard(v)).join('')}</div>`:'<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-title">No results</div></div>'}
            `; 
        }

        // Profile Edit
        function editProfile() {
            editingItem = currentUser;
            editingType = 'user';
            document.getElementById('editTitle').textContent = '✏️ Edit Profile';
            document.getElementById('editDeleteBtn').style.display = 'none';
            document.getElementById('editBody').innerHTML = `
                <div class="form-group"><label class="form-label">Avatar URL</label><input type="text" id="editAvatar" class="form-input" value="${currentUser.avatar||''}"></div>
                <div class="form-group"><label class="form-label">Twitter</label><input type="text" id="editTwitter" class="form-input" value="${currentUser.social?.twitter||''}"></div>
                <div class="form-group"><label class="form-label">Instagram</label><input type="text" id="editInstagram" class="form-input" value="${currentUser.social?.instagram||''}"></div>
                <div class="form-group"><label class="form-label">GitHub</label><input type="text" id="editGithub" class="form-input" value="${currentUser.social?.github||''}"></div>
            `;
            openModal('editModal');
        }

        // Share & QR
        function generateQR() {
            const qrDiv = document.getElementById('qrcode');
            qrDiv.innerHTML = '';
            const url = window.location.href;
            new QRCode(qrDiv, {
                text: url,
                width: 180,
                height: 180,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        }
        function shareSocial(platform) {
            const url = encodeURIComponent(window.location.href);
            const text = encodeURIComponent('Check out XtreamHub!');
            let shareUrl = '';
            if(platform === 'twitter') shareUrl = `https://twitter.com/intent/tweet?url=${url}&text=${text}`;
            else if(platform === 'facebook') shareUrl = `https://www.facebook.com/sharer/sharer.php?u=${url}`;
            else if(platform === 'whatsapp') shareUrl = `https://api.whatsapp.com/send?text=${text} ${url}`;
            else if(platform === 'telegram') shareUrl = `https://t.me/share/url?url=${url}&text=${text}`;
            else if(platform === 'linkedin') shareUrl = `https://www.linkedin.com/sharing/share-offsite/?url=${url}`;
            if(shareUrl) window.open(shareUrl, '_blank');
        }
        function copyShareLink() {
            navigator.clipboard.writeText(window.location.href);
            showToast('Link copied!');
        }
        function exportData() {
            const data = {
                users, channels, videos, shorts, lives, musicList, follows, bannedUsers,
                version: '1.0', exportDate: new Date().toISOString()
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `xtreamhub-backup-${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('Data exported');
        }
        function importData(event) {
            const file = event.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if(data.users) users = data.users;
                    if(data.channels) channels = data.channels;
                    if(data.videos) videos = data.videos;
                    if(data.shorts) shorts = data.shorts;
                    if(data.lives) lives = data.lives;
                    if(data.musicList) musicList = data.musicList;
                    if(data.follows) follows = data.follows;
                    if(data.bannedUsers) bannedUsers = data.bannedUsers;
                    saveData();
                    render();
                    showToast('Data imported');
                } catch(err) {
                    showToast('Invalid file', 'error');
                }
            };
            reader.readAsText(file);
        }

        // Events
        document.addEventListener('DOMContentLoaded',init);
        document.addEventListener('keydown',e=>{if(e.key==='Escape'){['authModal','addChannelModal','addVideoModal','addMusicModal','adminModal','editModal','editMusicModal','shareModal'].forEach(closeModal);}});
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</body>
</html>
