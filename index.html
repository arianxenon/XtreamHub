<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XtreamHub - Video Platform</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0f0f0f;
            --bg-secondary: #181818;
            --bg-tertiary: #212121;
            --bg-hover: #272727;
            --border-color: #303030;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --text-muted: #717171;
            --accent: #ff0000;
            --accent-hover: #cc0000;
            --danger: #ff4757;
            --success: #00b894;
            --live: #ff0000;
            --purple: #9146ff;
        }
        body { font-family: 'Roboto', Arial, sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; }

        /* Header */
        .header { height: 56px; background: var(--bg-secondary); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; position: fixed; top: 0; left: 0; right: 0; z-index: 1000; }
        .header-left { display: flex; align-items: center; gap: 16px; }
        .menu-btn { width: 40px; height: 40px; background: transparent; border: none; color: white; cursor: pointer; border-radius: 50%; font-size: 20px; }
        .menu-btn:hover { background: var(--bg-hover); }
        .logo { display: flex; align-items: center; gap: 4px; cursor: pointer; color: white; }
        .logo-icon { font-size: 28px; font-weight: bold; }
        .logo-text { font-size: 20px; font-weight: bold; }
        .logo-text span { color: var(--accent); }
        .header-center { display: flex; flex: 1; max-width: 600px; margin: 0 auto; padding: 0 20px; }
        .search-box { display: flex; flex: 1; }
        .search-input { flex: 1; padding: 10px 16px; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 20px 0 0 20px; color: white; font-size: 14px; outline: none; }
        .search-input:focus { border-color: #1c62b9; }
        .search-btn { width: 60px; background: var(--bg-tertiary); border: 1px solid var(--border-color); border-left: none; border-radius: 0 20px 20px 0; color: white; cursor: pointer; font-size: 16px; }
        .header-right { display: flex; align-items: center; gap: 8px; }
        .user-menu { display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--bg-tertiary); border-radius: 20px; cursor: pointer; color: white; border: none; }
        .user-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; overflow: hidden; }
        .user-avatar img { width: 100%; height: 100%; object-fit: cover; }

        /* Buttons */
        .btn { padding: 10px 20px; border: none; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-secondary { background: var(--bg-tertiary); color: white; }
        .btn-ghost { background: transparent; color: var(--text-secondary); }
        .btn-ghost:hover { background: var(--bg-hover); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .btn-icon { width: 40px; height: 40px; padding: 0; border-radius: 50%; justify-content: center; }

        /* Sidebar */
        .sidebar { position: fixed; top: 56px; left: 0; width: 240px; height: calc(100vh - 56px); background: var(--bg-secondary); overflow-y: auto; padding: 12px 0; z-index: 100; transition: width 0.3s; }
        .sidebar.collapsed { width: 72px; }
        .sidebar-item { display: flex; align-items: center; gap: 20px; padding: 10px 16px; cursor: pointer; color: var(--text-primary); border-radius: 8px; margin: 0 8px; }
        .sidebar-item:hover { background: var(--bg-hover); }
        .sidebar-item.active { background: var(--bg-hover); }
        .sidebar-icon { font-size: 20px; width: 24px; text-align: center; }
        .sidebar-text { font-size: 14px; white-space: nowrap; }
        .sidebar.collapsed .sidebar-text { display: none; }
        .sidebar.collapsed .sidebar-item { justify-content: center; gap: 0; }
        .sidebar-divider { height: 1px; background: var(--border-color); margin: 12px 16px; }
        .sidebar-section { padding: 8px 16px; font-size: 12px; font-weight: 500; color: var(--text-secondary); text-transform: uppercase; }
        .sidebar.collapsed .sidebar-section { display: none; }

        /* Main Content */
        .main-content { margin-top: 56px; margin-left: 240px; padding: 20px; min-height: calc(100vh - 56px); transition: margin-left 0.3s; padding-right: 80px; }
        .main-content.expanded { margin-left: 72px; }

        /* Section Headers */
        .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .section-title { font-size: 20px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .see-all { color: var(--text-secondary); font-size: 14px; cursor: pointer; }
        .see-all:hover { color: white; }

        /* Category Pills */
        .category-pills { display: flex; gap: 10px; padding: 12px 0; margin-bottom: 20px; overflow-x: auto; }
        .category-pill { padding: 8px 16px; background: var(--bg-tertiary); border: none; border-radius: 8px; color: white; font-size: 14px; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
        .category-pill:hover { background: var(--bg-hover); }
        .category-pill.active { background: white; color: black; }

        /* Stats */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-bottom: 24px; }
        .stat-card { background: var(--bg-secondary); border-radius: 12px; padding: 16px; text-align: center; }
        .stat-value { font-size: 28px; font-weight: 700; color: var(--accent); }
        .stat-label { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

        /* Video Grid */
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-bottom: 32px; }
        .video-card { cursor: pointer; transition: transform 0.2s; }
        .video-card:hover { transform: scale(1.02); }
        .video-card .admin-controls { opacity: 0; transition: opacity 0.2s; }
        .video-card:hover .admin-controls { opacity: 1; }
        .video-thumbnail { position: relative; width: 100%; padding-top: 56.25%; background: var(--bg-tertiary); border-radius: 12px; overflow: hidden; }
        .video-thumbnail img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .video-duration { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.9); padding: 2px 6px; border-radius: 4px; font-size: 12px; font-weight: 500; }
        .video-platform { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.8); padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: 500; }
        .video-info { display: flex; gap: 12px; padding: 12px 0; }
        .channel-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--bg-tertiary); display: flex; align-items: center; justify-content: center; font-size: 18px; overflow: hidden; cursor: pointer; flex-shrink: 0; }
        .channel-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .video-details { flex: 1; min-width: 0; }
        .video-title { font-size: 14px; font-weight: 500; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; }
        .video-meta { font-size: 12px; color: var(--text-secondary); }

        /* Shorts Section */
        .shorts-section { margin-bottom: 32px; }
        .shorts-grid { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 12px; }
        .short-card { min-width: 180px; max-width: 180px; cursor: pointer; transition: transform 0.2s; }
        .short-card:hover { transform: scale(1.05); }
        .short-thumbnail { position: relative; width: 100%; padding-top: 177%; background: var(--bg-tertiary); border-radius: 12px; overflow: hidden; }
        .short-thumbnail img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .short-overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 12px; background: linear-gradient(transparent, rgba(0,0,0,0.9)); }
        .short-title { font-size: 13px; font-weight: 500; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .short-views { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }
        .short-badge { position: absolute; top: 8px; left: 8px; background: var(--accent); padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 600; }

        /* Live Section */
        .live-section { margin-bottom: 32px; }
        .live-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
        .live-card { cursor: pointer; transition: transform 0.2s; position: relative; }
        .live-card:hover { transform: scale(1.02); }
        .live-badge { position: absolute; top: 8px; left: 8px; background: var(--live); padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 4px; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .live-viewers { position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.8); padding: 4px 10px; border-radius: 4px; font-size: 12px; display: flex; align-items: center; gap: 4px; }
        .live-info { display: flex; gap: 12px; padding: 12px 0; }
        .live-title { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
        .live-streamer { font-size: 12px; color: var(--text-secondary); }
        .live-game { font-size: 11px; color: var(--purple); margin-top: 2px; }

        /* Add Card */
        .add-card { background: var(--bg-secondary); border: 2px dashed var(--border-color); border-radius: 12px; min-height: 180px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; }
        .add-card:hover { border-color: var(--accent); background: var(--bg-hover); }
        .add-card-icon { font-size: 40px; margin-bottom: 8px; }
        .add-card-text { color: var(--text-secondary); font-size: 14px; }

        /* Channel Page */
        .channel-banner { width: 100%; height: 180px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 12px; margin-bottom: 20px; overflow: hidden; }
        .channel-banner img { width: 100%; height: 100%; object-fit: cover; }
        .channel-header { display: flex; align-items: flex-start; gap: 20px; margin-bottom: 24px; }
        .channel-avatar-large { width: 140px; height: 140px; border-radius: 50%; background: var(--bg-tertiary); display: flex; align-items: center; justify-content: center; font-size: 56px; overflow: hidden; flex-shrink: 0; border: 4px solid var(--bg-primary); }
        .channel-avatar-large img { width: 100%; height: 100%; object-fit: cover; }
        .channel-info { flex: 1; }
        .channel-name { font-size: 26px; font-weight: bold; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .channel-handle { color: var(--text-secondary); font-size: 14px; margin-bottom: 12px; }
        .channel-stats { display: flex; gap: 20px; color: var(--text-secondary); font-size: 14px; margin-bottom: 12px; }
        .channel-actions { display: flex; gap: 12px; margin-top: 12px; }
        .channel-tabs { display: flex; border-bottom: 1px solid var(--border-color); margin-bottom: 20px; }
        .channel-tab { padding: 14px 28px; background: none; border: none; color: var(--text-secondary); font-size: 14px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.2s; font-weight: 500; }
        .channel-tab:hover { color: white; }
        .channel-tab.active { color: white; border-bottom-color: white; }

        /* About Section */
        .about-section { background: var(--bg-secondary); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .about-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .about-description { color: var(--text-secondary); line-height: 1.6; margin-bottom: 20px; }
        .about-info-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
        .about-info-item { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--bg-tertiary); border-radius: 8px; }
        .about-info-icon { font-size: 24px; }
        .about-info-label { font-size: 12px; color: var(--text-muted); }
        .about-info-value { font-size: 14px; font-weight: 500; }

        /* Empty State */
        .empty-state { text-align: center; padding: 60px 32px; color: var(--text-secondary); }
        .empty-icon { font-size: 64px; margin-bottom: 16px; }
        .empty-title { font-size: 20px; font-weight: 600; margin-bottom: 8px; color: var(--text-primary); }

        /* Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 2000; }
        .modal-overlay.active { display: flex; }
        .modal { background: var(--bg-secondary); border-radius: 12px; width: 90%; max-width: 480px; max-height: 90vh; overflow-y: auto; }
        .modal-lg { max-width: 650px; }
        .modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: var(--bg-secondary); }
        .modal-title { font-size: 18px; font-weight: 600; }
        .modal-close { width: 32px; height: 32px; background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 22px; border-radius: 50%; }
        .modal-close:hover { background: var(--bg-hover); color: white; }
        .modal-body { padding: 20px; }
        .modal-footer { padding: 16px 20px; border-top: 1px solid var(--border-color); display: flex; gap: 12px; justify-content: flex-end; }

        /* Form */
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; margin-bottom: 6px; color: var(--text-secondary); font-size: 14px; font-weight: 500; }
        .form-input { width: 100%; padding: 10px 14px; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 8px; color: white; font-size: 14px; outline: none; }
        .form-input:focus { border-color: var(--accent); }
        .form-select { width: 100%; padding: 10px 14px; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 8px; color: white; font-size: 14px; outline: none; cursor: pointer; }
        .form-error { color: var(--danger); font-size: 13px; margin-top: 8px; text-align: center; }

        /* Tabs */
        .tabs { display: flex; background: var(--bg-tertiary); border-radius: 8px; margin-bottom: 16px; padding: 4px; }
        .tab { flex: 1; padding: 10px; border: none; background: none; color: var(--text-secondary); cursor: pointer; border-radius: 6px; font-weight: 500; }
        .tab.active { background: var(--bg-primary); color: white; }

        /* Admin */
        .admin-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
        .admin-tab { flex: 1; padding: 10px; background: var(--bg-tertiary); border: none; border-radius: 8px; color: var(--text-secondary); cursor: pointer; font-size: 13px; }
        .admin-tab.active { background: var(--accent); color: white; }
        .admin-list { max-height: 350px; overflow-y: auto; }
        .admin-item { display: flex; align-items: center; justify-content: space-between; padding: 12px; background: var(--bg-tertiary); border-radius: 8px; margin-bottom: 8px; }
        .admin-item-left { display: flex; align-items: center; gap: 12px; }
        .badge { font-size: 10px; padding: 2px 8px; border-radius: 4px; font-weight: 500; }
        .badge-admin { background: var(--accent); }
        .badge-banned { background: var(--danger); }

        /* Toast */
        .toast { position: fixed; bottom: 20px; right: 20px; background: var(--bg-secondary); color: white; padding: 14px 20px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); display: none; align-items: center; gap: 10px; z-index: 3000; }
        .toast.show { display: flex; }
        .toast.success { border-left: 4px solid var(--success); }
        .toast.error { border-left: 4px solid var(--danger); }

        /* Chat Panel */
        .chat-panel { position: fixed; bottom: 0; right: 0; width: 300px; height: 400px; background: var(--bg-secondary); border-radius: 12px 0 0 0; z-index: 500; transform: translateY(360px); transition: transform 0.3s ease; box-shadow: -4px -4px 20px rgba(0,0,0,0.3); }
        .chat-panel:hover, .chat-panel.expanded { transform: translateY(0); }
        .chat-header { padding: 12px 16px; background: var(--bg-tertiary); border-radius: 12px 0 0 0; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
        .chat-title { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .chat-online { font-size: 11px; color: var(--success); }
        .chat-toggle { background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 16px; }
        .chat-messages { height: 280px; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .chat-msg { display: flex; gap: 8px; font-size: 13px; }
        .chat-msg-avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 10px; flex-shrink: 0; }
        .chat-msg-content { flex: 1; }
        .chat-msg-user { color: var(--text-secondary); font-size: 11px; }
        .chat-msg-text { color: white; word-break: break-word; }
        .chat-input-area { padding: 12px; border-top: 1px solid var(--border-color); display: flex; gap: 8px; }
        .chat-input { flex: 1; padding: 8px 12px; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 20px; color: white; font-size: 13px; outline: none; }
        .chat-send { width: 36px; height: 36px; background: var(--accent); border: none; border-radius: 50%; color: white; cursor: pointer; font-size: 14px; }
        .chat-tab { position: absolute; top: -30px; right: 0; background: var(--bg-tertiary); padding: 6px 12px; border-radius: 8px 8px 0 0; font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .chat-indicator { width: 8px; height: 8px; background: var(--success); border-radius: 50%; animation: blink 2s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        /* Loading */
        .loading { display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column; gap: 16px; }
        .loading-spinner { width: 44px; height: 44px; border: 3px solid var(--bg-tertiary); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Responsive */
        @media (max-width: 1024px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; padding-right: 20px; }
            .chat-panel { width: 260px; }
        }
        @media (max-width: 768px) {
            .header-center { display: none; }
            .video-grid { grid-template-columns: 1fr; }
            .shorts-grid { gap: 8px; }
            .short-card { min-width: 140px; max-width: 140px; }
            .channel-header { flex-direction: column; align-items: center; text-align: center; }
            .channel-avatar-large { width: 100px; height: 100px; font-size: 40px; }
            .chat-panel { width: 100%; height: 350px; border-radius: 12px 12px 0 0; }
        }
    </style>
</head>
<body>
    <!-- Loading -->
    <div id="loading" class="loading">
        <div class="loading-spinner"></div>
        <div>Loading XtreamHub...</div>
    </div>

    <!-- App -->
    <div id="app" style="display: none;">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <button class="menu-btn" onclick="toggleSidebar()">☰</button>
                <div class="logo" onclick="showHome()">
                    <span class="logo-icon">X</span>
                    <span class="logo-text">tream<span>Hub</span></span>
                </div>
            </div>
            <div class="header-center">
                <div class="search-box">
                    <input type="text" class="search-input" id="searchInput" placeholder="Search videos...">
                    <button class="search-btn" onclick="handleSearch()">🔍</button>
                </div>
            </div>
            <div class="header-right" id="headerRight"></div>
        </header>

        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-item active" onclick="showHome()"><span class="sidebar-icon">🏠</span><span class="sidebar-text">Home</span></div>
            <div class="sidebar-item" onclick="showShorts()"><span class="sidebar-icon">⚡</span><span class="sidebar-text">Shorts</span></div>
            <div class="sidebar-item" onclick="showLive()"><span class="sidebar-icon">🔴</span><span class="sidebar-text">Live</span></div>
            <div class="sidebar-item" onclick="showExplore()"><span class="sidebar-icon">🧭</span><span class="sidebar-text">Explore</span></div>
            <div class="sidebar-item" onclick="showChannels()"><span class="sidebar-icon">📺</span><span class="sidebar-text">Channels</span></div>
            <div class="sidebar-divider"></div>
            <div class="sidebar-section">Library</div>
            <div class="sidebar-item" onclick="showHistory()"><span class="sidebar-icon">🕐</span><span class="sidebar-text">History</span></div>
            <div class="sidebar-item" onclick="showLiked()"><span class="sidebar-icon">👍</span><span class="sidebar-text">Liked</span></div>
            <div class="sidebar-divider"></div>
            <div class="sidebar-section">Channels</div>
            <div id="sidebarChannels"></div>
        </aside>

        <!-- Main -->
        <main id="mainContent" class="main-content"><div id="pageContent"></div></main>

        <!-- Chat Panel -->
        <div class="chat-panel" id="chatPanel">
            <div class="chat-tab" onclick="toggleChat()">
                <span class="chat-indicator"></span>
                <span>Live Chat</span>
            </div>
            <div class="chat-header" onclick="toggleChat()">
                <div class="chat-title">💬 Live Chat <span class="chat-online" id="chatOnline">(12 online)</span></div>
                <button class="chat-toggle" id="chatToggle">▲</button>
            </div>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input-area">
                <input type="text" class="chat-input" id="chatInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter')sendChat()">
                <button class="chat-send" onclick="sendChat()">➤</button>
            </div>
        </div>
    </div>

    <!-- Auth Modal -->
    <div id="authModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header"><span class="modal-title">Welcome to XtreamHub</span><button class="modal-close" onclick="closeModal('authModal')">×</button></div>
            <div class="modal-body">
                <div class="tabs"><button class="tab active" onclick="switchAuthTab('login')">Login</button><button class="tab" onclick="switchAuthTab('register')">Register</button></div>
                <div id="loginForm">
                    <div class="form-group"><label class="form-label">Username</label><input type="text" id="loginUsername" class="form-input"></div>
                    <div class="form-group"><label class="form-label">Password</label><input type="password" id="loginPassword" class="form-input"></div>
                    <div id="loginError" class="form-error"></div>
                    <button class="btn btn-primary" style="width:100%" onclick="handleLogin()">🔑 Login</button>
                </div>
                <div id="registerForm" style="display:none">
                    <div class="form-group"><label class="form-label">Username</label><input type="text" id="registerUsername" class="form-input"></div>
                    <div class="form-group"><label class="form-label">Password</label><input type="password" id="registerPassword" class="form-input"></div>
                    <div id="registerError" class="form-error"></div>
                    <button class="btn btn-primary" style="width:100%" onclick="handleRegister()">👤 Register</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Channel Modal -->
    <div id="addChannelModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header"><span class="modal-title">➕ Add Channel</span><button class="modal-close" onclick="closeModal('addChannelModal')">×</button></div>
            <div class="modal-body">
                <div class="form-group"><label class="form-label">Name *</label><input type="text" id="channelName" class="form-input"></div>
                <div class="form-group"><label class="form-label">Handle *</label><input type="text" id="channelHandle" class="form-input" placeholder="@username"></div>
                <div class="form-group"><label class="form-label">Description</label><textarea id="channelDesc" class="form-input" rows="2"></textarea></div>
                <div class="form-group"><label class="form-label">Avatar URL</label><input type="text" id="channelAvatar" class="form-input" dir="ltr"></div>
                <div class="form-group"><label class="form-label">Banner URL</label><input type="text" id="channelBanner" class="form-input" dir="ltr"></div>
            </div>
            <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal('addChannelModal')">Cancel</button><button class="btn btn-primary" onclick="handleAddChannel()">Add</button></div>
        </div>

    <!-- Add Video Modal -->
    <div id="addVideoModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header"><span class="modal-title">➕ Add Content</span><button class="modal-close" onclick="closeModal('addVideoModal')">×</button></div>
            <div class="modal-body">
                <div class="form-group"><label class="form-label">Type</label><select id="videoType" class="form-select"><option value="video">Video</option><option value="short">Short</option><option value="live">Live Stream</option></select></div>
                <div class="form-group"><label class="form-label">Channel *</label><select id="videoChannel" class="form-select"><option value="">Select...</option></select></div>
                <div class="form-group"><label class="form-label">Title *</label><input type="text" id="videoTitle" class="form-input"></div>
                <div class="form-group"><label class="form-label">URL *</label><input type="text" id="videoUrl" class="form-input" dir="ltr"></div>
                <div class="form-group"><label class="form-label">Category</label><select id="videoCategory" class="form-select"><option value="all">All</option><option value="gaming">Gaming</option><option value="music">Music</option><option value="sports">Sports</option><option value="news">News</option><option value="entertainment">Entertainment</option><option value="education">Education</option><option value="tech">Tech</option></select></div>
                <div class="form-group"><label class="form-label">Platform</label><select id="videoPlatform" class="form-select"><option value="youtube">🔴 YouTube</option><option value="twitch">🟣 Twitch</option><option value="aparat">🎬 Aparat</option><option value="kick">💚 Kick</option><option value="other">📺 Other</option></select></div>
                <div class="form-group"><label class="form-label">Thumbnail</label><input type="text" id="videoThumbnail" class="form-input" dir="ltr"></div>
                <div class="form-group"><label class="form-label">Duration</label><input type="text" id="videoDuration" class="form-input" placeholder="10:30" dir="ltr"></div>
                <div class="form-group"><label class="form-label">Game/Category (for Live)</label><input type="text" id="videoGame" class="form-input" placeholder="e.g. Valorant, Just Chatting"></div>
            </div>
            <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal('addVideoModal')">Cancel</button><button class="btn btn-primary" onclick="handleAddVideo()">Add</button></div>
        </div>
    </div>

    <!-- Admin Modal -->
    <div id="adminModal" class="modal-overlay">
        <div class="modal modal-lg">
            <div class="modal-header"><span class="modal-title">🛡️ Admin Panel</span><button class="modal-close" onclick="closeModal('adminModal')">×</button></div>
            <div class="modal-body">
                <div class="admin-tabs"><button class="admin-tab active" onclick="switchAdminTab('channels')">📺 Channels</button><button class="admin-tab" onclick="switchAdminTab('videos')">🎬 Videos</button><button class="admin-tab" onclick="switchAdminTab('users')">👥 Users</button></div>
                <div id="adminChannelsTab" class="admin-list"></div>
                <div id="adminVideosTab" class="admin-list" style="display:none"></div>
                <div id="adminUsersTab" class="admin-list" style="display:none"></div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header"><span class="modal-title" id="editTitle">Edit</span><button class="modal-close" onclick="closeModal('editModal')">×</button></div>
            <div class="modal-body" id="editBody"></div>
            <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal('editModal')">Cancel</button><button class="btn btn-danger" id="editDeleteBtn" onclick="deleteFromEdit()">Delete</button><button class="btn btn-primary" onclick="saveEdit()">Save</button></div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"><span id="toastIcon"></span><span id="toastMsg"></span></div>

    <script>
        // Constants
        const ADMIN_USER = 'arianxenon';
        const ADMIN_PASS = '2981354361max';
        const COLORS = ['#ff6b6b','#4ecdc4','#45b7d1','#96ceb4','#ffeaa7','#fd79a8','#a29bfe','#00b894','#e17055','#74b9ff'];
        const DEFAULT_THUMB = 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMzIwIiBoZWlnaHQ9IjE4MCIgdmlld0JveD0iMCAwIDMyMCAxODAiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxyZWN0IHdpZHRoPSIzMjAiIGhlaWdodD0iMTgwIiBmaWxsPSIjMjEyMTIxIi8+CjxwYXRoIGQ9Ik0xMjggNzBMMTkyIDkwTDEyOCAxMTBWNzBaIiBmaWxsPSIjZmYwMDAwIi8+Cjwvc3ZnPg==';
        const GAMING_EMOJIS = ['🎮','🕹️','👾','🚀','⚡','🔥','💎','🎯','🏆','🎲','🎪','🌟','💥','🦂','🦾','🎰','🎱','🎖️','🏅','👑'];
        const CATEGORIES = ['All','Gaming','Music','Sports','News','Entertainment','Education','Tech'];

        // State
        let currentUser = null, users = [], channels = [], videos = [], shorts = [], lives = [];
        let currentPage = 'home', currentChannel = null, activeCategory = 'All', channelTab = 'videos';
        let editingItem = null, editingType = null;
        let chatExpanded = false;
        let chatMessages = [];

        // Helpers
        const getEmoji = name => { let h=0; for(let i=0;i<name.length;i++) h=name.charCodeAt(i)+((h<<5)-h); return GAMING_EMOJIS[Math.abs(h)%GAMING_EMOJIS.length]; };
        const getAvatar = c => !c?'🎮':c.avatar?`<img src="${c.avatar}">`:getEmoji(c.name);
        const formatNum = n => n>=1000000?(n/1000000).toFixed(1)+'M':n>=1000?(n/1000).toFixed(1)+'K':n;
        const formatDate = t => t?new Date(t).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'Unknown';
        const getPlatformIcon = p => ({youtube:'🔴',twitch:'🟣',aparat:'🎬',kick:'💚'}[p]||'📺');
        const getPlatformName = p => ({youtube:'YouTube',twitch:'Twitch',aparat:'Aparat',kick:'Kick'}[p]||'Platform');

        function showToast(msg,type='success') {
            const t=document.getElementById('toast'),i=document.getElementById('toastIcon'),m=document.getElementById('toastMsg');
            t.className='toast '+type; i.textContent=type==='success'?'✅':'❌'; m.textContent=msg; t.classList.add('show');
            setTimeout(()=>t.classList.remove('show'),3000);
        }

        // Data
        function loadData() {
            users=JSON.parse(localStorage.getItem('xh-users')||'[]');
            channels=JSON.parse(localStorage.getItem('xh-channels')||'[]');
            const allContent=JSON.parse(localStorage.getItem('xh-videos')||'[]');
            videos=allContent.filter(v=>v.type!=='short'&&v.type!=='live');
            shorts=allContent.filter(v=>v.type==='short');
            lives=allContent.filter(v=>v.type==='live');
            if(!users.find(u=>u.username===ADMIN_USER)) users.push({id:'admin',username:ADMIN_USER,password:ADMIN_PASS,color:'#ff0000',isAdmin:true,isBanned:false,createdAt:Date.now()});
            const admin=users.find(u=>u.username===ADMIN_USER); if(admin){admin.password=ADMIN_PASS;admin.isAdmin=true;}
            const saved=localStorage.getItem('xh-current'); if(saved){const u=users.find(x=>x.id===saved&&!x.isBanned); if(u)currentUser=u;}
            initChat();
            saveData();
        }
        function saveData() {
            const allContent=[...videos,...shorts,...lives];
            localStorage.setItem('xh-users',JSON.stringify(users));
            localStorage.setItem('xh-channels',JSON.stringify(channels));
            localStorage.setItem('xh-videos',JSON.stringify(allContent));
            if(currentUser) localStorage.setItem('xh-current',currentUser.id);
            else localStorage.removeItem('xh-current');
        }

        // Chat
        function initChat() {
            chatMessages=[
                {user:'GamerPro',text:'Hey everyone! 👋',color:'#ff6b6b'},
                {user:'StreamFan',text:'Nice streams here!',color:'#4ecdc4'},
                {user:'NightOwl',text:'Who is watching shorts?',color:'#45b7d1'},
            ];
            renderChat();
        }
        function renderChat() {
            document.getElementById('chatMessages').innerHTML=chatMessages.map(m=>`
                <div class="chat-msg"><div class="chat-msg-avatar" style="background:${m.color}">${m.user[0]}</div><div class="chat-msg-content"><div class="chat-msg-user">${m.user}</div><div class="chat-msg-text">${m.text}</div></div></div>
            `).join('');
            document.getElementById('chatMessages').scrollTop=document.getElementById('chatMessages').scrollHeight;
        }
        function sendChat() {
            const input=document.getElementById('chatInput');
            const text=input.value.trim();
            if(!text)return;
            chatMessages.push({user:currentUser?.username||'Guest',text:text,color:currentUser?.color||'#888'});
            input.value='';
            renderChat();
            saveChat();
        }
        function saveChat() {
            localStorage.setItem('xh-chat',JSON.stringify(chatMessages.slice(-50)));
        }
        function toggleChat() {
            chatExpanded=!chatExpanded;
            document.getElementById('chatPanel').classList.toggle('expanded',chatExpanded);
            document.getElementById('chatToggle').textContent=chatExpanded?'▼':'▲';
        }

        // Init
        function init() { loadData(); render(); document.getElementById('loading').style.display='none'; document.getElementById('app').style.display='block'; }
        function render() { renderHeader(); renderSidebar(); renderPage(); }

        // Header
        function renderHeader() {
            const h=document.getElementById('headerRight');
            if(currentUser) {
                const av=currentUser.avatar?`<img src="${currentUser.avatar}">`:currentUser.username[0].toUpperCase();
                h.innerHTML=`${currentUser.isAdmin?'<button class="btn btn-icon btn-ghost" onclick="openAdmin()">🛡️</button>':''}
                    <button class="user-menu"><div class="user-avatar" style="background:${currentUser.avatar?'transparent':currentUser.color}">${av}</div><span>${currentUser.username}</span></button>
                    <button class="btn btn-icon btn-ghost" onclick="logout()">🚪</button>`;
            } else h.innerHTML='<button class="btn btn-primary" onclick="openModal(\'authModal\')">🔑 Sign in</button>';
        }

        // Sidebar
        function renderSidebar() {
            document.getElementById('sidebarChannels').innerHTML=channels.slice(0,5).map(c=>
                `<div class="sidebar-item" onclick="showChannel('${c.id}')"><div class="channel-avatar" style="width:24px;height:24px;font-size:12px">${getAvatar(c)}</div><span class="sidebar-text">${c.name}</span></div>`
            ).join('');
        }
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
            document.getElementById('mainContent').classList.toggle('expanded');
        }

        // Pages
        function renderPage() {
            const c=document.getElementById('pageContent');
            if(currentPage==='home') renderHome(c);
            else if(currentPage==='shorts') renderShorts(c);
            else if(currentPage==='live') renderLive(c);
            else if(currentPage==='channel') renderChannel(c);
            else if(currentPage==='channels') renderChannels(c);
            else if(currentPage==='explore') renderExplore(c);
            else if(currentPage==='history') renderHistory(c);
            else if(currentPage==='liked') renderLiked(c);
        }

        function renderHome(c) {
            let html='';

            // Live Section
            if(lives.length) {
                html+=`<div class="live-section">
                    <div class="section-header"><div class="section-title">🔴 Live Now</div><span class="see-all" onclick="showLive()">See all</span></div>
                    <div class="live-grid">${lives.slice(0,4).map(v=>liveCard(v)).join('')}</div>
                </div>`;
            }

            // Shorts Section
            if(shorts.length) {
                html+=`<div class="shorts-section">
                    <div class="section-header"><div class="section-title">⚡ Shorts</div><span class="see-all" onclick="showShorts()">See all</span></div>
                    <div class="shorts-grid">${shorts.slice(0,6).map(v=>shortCard(v)).join('')}</div>
                </div>`;
            }

            // Categories
            html+=`<div class="category-pills">${CATEGORIES.map(cat=>`<button class="category-pill ${activeCategory===cat?'active':''}" onclick="setCategory('${cat}')">${cat}</button>`).join('')}</div>`;

            // Admin Cards
            if(currentUser?.isAdmin) html+=`<div class="video-grid" style="margin-bottom:20px"><div class="add-card" onclick="openModal('addVideoModal')"><div class="add-card-icon">➕</div><div class="add-card-text">Add Content</div></div><div class="add-card" onclick="openModal('addChannelModal')"><div class="add-card-icon">📺</div><div class="add-card-text">Add Channel</div></div></div>`;

            // Stats
            html+=`<div class="stats-grid"><div class="stat-card"><div class="stat-value">${videos.length}</div><div class="stat-label">Videos</div></div><div class="stat-card"><div class="stat-value">${shorts.length}</div><div class="stat-label">Shorts</div></div><div class="stat-card"><div class="stat-value">${lives.length}</div><div class="stat-label">Live</div></div><div class="stat-card"><div class="stat-value">${channels.length}</div><div class="stat-label">Channels</div></div></div>`;

            // Videos
            let filtered=activeCategory==='All'?videos:videos.filter(v=>(v.category||'all').toLowerCase()===activeCategory.toLowerCase());
            html+=`<div class="section-header"><div class="section-title">🎬 Videos</div></div>`;
            html+=filtered.length?`<div class="video-grid">${filtered.map(v=>videoCard(v)).join('')}</div>`:`<div class="empty-state"><div class="empty-icon">🎬</div><div class="empty-title">No videos</div></div>`;

            c.innerHTML=html;
        }

        function shortCard(v) {
            const ch=channels.find(x=>x.id===v.channelId);
            return `<div class="short-card" onclick="openVideo('${v.id}','short')">
                <div class="short-thumbnail"><img src="${v.thumbnail||DEFAULT_THUMB}" onerror="this.src='${DEFAULT_THUMB}'">
                    <div class="short-badge">SHORT</div>
                    <div class="short-overlay"><div class="short-title">${v.title}</div><div class="short-views">${formatNum(v.views||0)} views</div></div>
                </div>
            </div>`;
        }

        function liveCard(v) {
            const ch=channels.find(x=>x.id===v.channelId);
            return `<div class="live-card" onclick="openVideo('${v.id}','live')">
                <div class="video-thumbnail"><img src="${v.thumbnail||DEFAULT_THUMB}" onerror="this.src='${DEFAULT_THUMB}'">
                    <div class="live-badge">🔴 LIVE</div>
                    <div class="live-viewers">👁️ ${formatNum(v.viewers||Math.floor(Math.random()*10000))}</div>
                </div>
                <div class="live-info"><div class="channel-avatar">${getAvatar(ch)}</div><div><div class="live-title">${v.title}</div><div class="live-streamer">${ch?.name||'Unknown'}</div>${v.game?`<div class="live-game">🎮 ${v.game}</div>`:''}</div></div>
            </div>`;
        }

        function videoCard(v) {
            const ch=channels.find(x=>x.id===v.channelId);
            return `<div class="video-card" onclick="openVideo('${v.id}','video')">
                <div class="video-thumbnail"><img src="${v.thumbnail||DEFAULT_THUMB}" onerror="this.src='${DEFAULT_THUMB}'">
                    ${v.duration?`<span class="video-duration">${v.duration}</span>`:''}
                    <span class="video-platform">${getPlatformIcon(v.platform)} ${getPlatformName(v.platform)}</span>
                    ${currentUser?.isAdmin?`<div class="admin-controls" style="position:absolute;top:8px;right:8px;display:flex;gap:4px"><button class="btn btn-sm" style="background:rgba(0,0,0,0.8)" onclick="event.stopPropagation();editContent('${v.id}','video')">✏️</button><button class="btn btn-sm btn-danger" onclick="event.stopPropagation();deleteContent('${v.id}','video')">🗑️</button></div>`:''}
                </div>
                <div class="video-info"><div class="channel-avatar" onclick="event.stopPropagation();showChannel('${v.channelId}')">${getAvatar(ch)}</div><div class="video-details"><div class="video-title">${v.title}</div><div class="video-meta">${ch?.name||'Unknown'}</div></div></div>
            </div>`;
        }

        function renderShorts(c) {
            c.innerHTML=`<div class="section-header"><div class="section-title">⚡ Shorts</div></div>`+
                (shorts.length?`<div class="shorts-grid" style="flex-wrap:wrap">${shorts.map(v=>shortCard(v)).join('')}</div>`:'<div class="empty-state"><div class="empty-icon">⚡</div><div class="empty-title">No shorts yet</div></div>');
        }

        function renderLive(c) {
            c.innerHTML=`<div class="section-header"><div class="section-title">🔴 Live Streams</div></div>`+
                (lives.length?`<div class="live-grid">${lives.map(v=>liveCard(v)).join('')}</div>`:'<div class="empty-state"><div class="empty-icon">🔴</div><div class="empty-title">No live streams</div></div>');
        }

        function openVideo(id,type) {
            let v;
            if(type==='short')v=shorts.find(x=>x.id===id);
            else if(type==='live')v=lives.find(x=>x.id===id);
            else v=videos.find(x=>x.id===id);
            if(v) {
                let h=JSON.parse(localStorage.getItem('xh-history')||'[]');
                h=h.filter(x=>x!==id); h.unshift(id); localStorage.setItem('xh-history',JSON.stringify(h.slice(0,50)));
                window.open(v.url,'_blank');
            }
        }

        function renderChannel(c) {
            if(!currentChannel){c.innerHTML='<div class="empty-state"><div class="empty-icon">📺</div><div class="empty-title">Not found</div></div>';return;}
            const cv=videos.filter(x=>x.channelId===currentChannel.id);
            const cs=shorts.filter(x=>x.channelId===currentChannel.id);
            const cl=lives.filter(x=>x.channelId===currentChannel.id);
            const views=[...cv,...cs,...cl].reduce((s,v)=>s+(v.views||0),0);
            let html=`<div class="channel-banner">${currentChannel.banner?`<img src="${currentChannel.banner}">`:''}</div>
            <div class="channel-header"><div class="channel-avatar-large">${getAvatar(currentChannel)}</div><div class="channel-info">
                <div class="channel-name">${currentChannel.name}${currentUser?.isAdmin?`<button class="btn btn-sm btn-ghost" onclick="editChannel('${currentChannel.id}')">✏️</button><button class="btn btn-sm btn-danger" onclick="deleteChannel('${currentChannel.id}')">🗑️</button>`:''}</div>
                <div class="channel-handle">${currentChannel.handle}</div>
                <div class="channel-stats"><span>📺 ${cv.length+cs.length} videos</span><span>🔴 ${cl.length} live</span><span>👁️ ${formatNum(views)} views</span></div>
                ${currentChannel.description?`<p style="color:var(--text-secondary);line-height:1.5;margin-top:8px">${currentChannel.description}</p>`:''}
            </div>${currentUser?.isAdmin?`<div class="channel-actions"><button class="btn btn-primary" onclick="openAddVideoFor('${currentChannel.id}')">➕ Add</button></div>`:''}</div>
            <div class="channel-tabs"><button class="channel-tab ${channelTab==='videos'?'active':''}" onclick="channelTab='videos';render()">🎬 Videos</button><button class="channel-tab ${channelTab==='shorts'?'active':''}" onclick="channelTab='shorts';render()">⚡ Shorts</button><button class="channel-tab ${channelTab==='live'?'active':''}" onclick="channelTab='live';render()">🔴 Live</button><button class="channel-tab ${channelTab==='about'?'active':''}" onclick="channelTab='about';render()">ℹ️ About</button></div>`;
            if(channelTab==='videos')html+=cv.length?`<div class="video-grid">${cv.map(v=>videoCard(v)).join('')}</div>`:'<div class="empty-state"><div class="empty-icon">🎬</div><div class="empty-title">No videos</div></div>';
            else if(channelTab==='shorts')html+=cs.length?`<div class="shorts-grid" style="flex-wrap:wrap">${cs.map(v=>shortCard(v)).join('')}</div>`:'<div class="empty-state"><div class="empty-icon">⚡</div><div class="empty-title">No shorts</div></div>';
            else if(channelTab==='live')html+=cl.length?`<div class="live-grid">${cl.map(v=>liveCard(v)).join('')}</div>`:'<div class="empty-state"><div class="empty-icon">🔴</div><div class="empty-title">No live streams</div></div>';
            else html+=`<div class="about-section"><div class="about-title">ℹ️ About ${currentChannel.name}</div><p class="about-description">${currentChannel.description||'No description provided.'}</p><div class="about-info-grid"><div class="about-info-item"><span class="about-info-icon">📺</span><div><div class="about-info-label">Videos</div><div class="about-info-value">${cv.length+cs.length}</div></div></div><div class="about-info-item"><span class="about-info-icon">🔴</span><div><div class="about-info-label">Live</div><div class="about-info-value">${cl.length}</div></div></div><div class="about-info-item"><span class="about-info-icon">👁️</span><div><div class="about-info-label">Views</div><div class="about-info-value">${formatNum(views)}</div></div></div><div class="about-info-item"><span class="about-info-icon">📅</span><div><div class="about-info-label">Joined</div><div class="about-info-value">${formatDate(currentChannel.createdAt)}</div></div></div></div></div>`;
            c.innerHTML=html;
        }

        function renderChannels(c) {
            let html=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px"><h1 style="font-size:24px">📺 All Channels</h1>${currentUser?.isAdmin?`<button class="btn btn-primary" onclick="openModal('addChannelModal')">➕ Add</button>`:''}</div>`;
            if(!channels.length) html+='<div class="empty-state"><div class="empty-icon">📺</div><div class="empty-title">No channels</div></div>';
            else html+=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px">${channels.map(ch=>{const cv=[...videos,...shorts,...lives].filter(v=>v.channelId===ch.id);return`<div style="text-align:center;padding:16px;background:var(--bg-secondary);border-radius:12px;cursor:pointer;position:relative"onclick="showChannel('${ch.id}')">${currentUser?.isAdmin?`<div style="position:absolute;top:8px;right:8px;display:flex;gap:4px"><button class="btn btn-sm"style="background:var(--bg-hover)"onclick="event.stopPropagation();editChannel('${ch.id}')">✏️</button><button class="btn btn-sm btn-danger"onclick="event.stopPropagation();deleteChannel('${ch.id}')">🗑️</button></div>`:''}<div style="width:80px;height:80px;border-radius:50%;margin:0 auto 12px;background:var(--bg-hover);display:flex;align-items:center;justify-content:center;font-size:36px">${getAvatar(ch)}</div><div style="font-weight:600">${ch.name}</div><div style="font-size:12px;color:var(--text-secondary)">${cv.length} content</div></div>`}).join('')}</div>`;
            c.innerHTML=html;
        }

        function renderExplore(c) {
            const all=[...videos,...shorts,...lives];
            c.innerHTML=`<h1 style="font-size:24px;margin-bottom:20px">🧭 Explore</h1>`+(all.length?`<div class="video-grid">${all.sort(()=>Math.random()-0.5).slice(0,12).map(v=>v.type==='short'?shortCard(v):v.type==='live'?liveCard(v):videoCard(v)).join('')}</div>`:'<div class="empty-state"><div class="empty-icon">🧭</div><div class="empty-title">No content</div></div>');
        }

        function renderHistory(c) {
            const h=JSON.parse(localStorage.getItem('xh-history')||'[]').map(id=>[...videos,...shorts,...lives].find(v=>v.id===id)).filter(v=>v);
            c.innerHTML=`<h1 style="font-size:24px;margin-bottom:20px">🕐 History</h1>`+(h.length?`<div class="video-grid">${h.map(v=>v.type==='short'?shortCard(v):v.type==='live'?liveCard(v):videoCard(v)).join('')}</div>`:'<div class="empty-state"><div class="empty-icon">🕐</div><div class="empty-title">No history</div></div>');
        }

        function renderLiked(c) {
            const l=JSON.parse(localStorage.getItem('xh-liked')||'[]').map(id=>[...videos,...shorts,...lives].find(v=>v.id===id)).filter(v=>v);
            c.innerHTML=`<h1 style="font-size:24px;margin-bottom:20px">👍 Liked</h1>`+(l.length?`<div class="video-grid">${l.map(v=>v.type==='short'?shortCard(v):v.type==='live'?liveCard(v):videoCard(v)).join('')}</div>`:'<div class="empty-state"><div class="empty-icon">👍</div><div class="empty-title">No liked</div></div>');
        }

        // Navigation
        const showHome=()=>{currentPage='home';currentChannel=null;activeCategory='All';render();};
        const showShorts=()=>{currentPage='shorts';render();};
        const showLive=()=>{currentPage='live';render();};
        const showExplore=()=>{currentPage='explore';render();};
        const showChannels=()=>{currentPage='channels';render();};
        const showHistory=()=>{currentPage='history';render();};
        const showLiked=()=>{currentPage='liked';render();};
        const showChannel=id=>{currentChannel=channels.find(c=>c.id===id);channelTab='videos';currentPage='channel';render();};
        const setCategory=cat=>{activeCategory=cat;render();};

        // Auth
        function switchAuthTab(t) {
            document.querySelectorAll('#authModal .tab').forEach(x=>x.classList.remove('active'));
            document.getElementById('loginForm').style.display=t==='login'?'block':'none';
            document.getElementById('registerForm').style.display=t==='register'?'block':'none';
            document.querySelectorAll('#authModal .tab')[t==='login'?0:1].classList.add('active');
        }
        function handleLogin() {
            const u=document.getElementById('loginUsername').value.trim(),p=document.getElementById('loginPassword').value;
            const user=users.find(x=>x.username===u&&x.password===p);
            if(!user)return document.getElementById('loginError').textContent='Invalid credentials';
            if(user.isBanned)return document.getElementById('loginError').textContent='Account banned';
            currentUser=user;saveData();closeModal('authModal');render();showToast('Welcome, '+u+'!');
        }
        function handleRegister() {
            const u=document.getElementById('registerUsername').value.trim(),p=document.getElementById('registerPassword').value;
            if(u.length<3)return document.getElementById('registerError').textContent='Min 3 chars';
            if(p.length<4)return document.getElementById('registerError').textContent='Min 4 chars';
            if(users.find(x=>x.username===u))return document.getElementById('registerError').textContent='Username taken';
            const nu={id:'u'+Date.now(),username:u,password:p,color:COLORS[Math.floor(Math.random()*COLORS.length)],isAdmin:false,isBanned:false,createdAt:Date.now()};
            users.push(nu);currentUser=nu;saveData();closeModal('authModal');render();showToast('Account created!');
        }
        const logout=()=>{currentUser=null;localStorage.removeItem('xh-current');showHome();render();showToast('Logged out');};

        // Channels
        function handleAddChannel() {
            const n=document.getElementById('channelName').value.trim(),h=document.getElementById('channelHandle').value.trim();
            if(!n||!h)return showToast('Name and handle required','error');
            channels.push({id:'c'+Date.now(),name:n,handle:h,description:document.getElementById('channelDesc').value.trim(),avatar:document.getElementById('channelAvatar').value.trim(),banner:document.getElementById('channelBanner').value.trim(),createdAt:Date.now()});
            saveData();closeModal('addChannelModal');render();showToast('Channel created!');
        }
        function editChannel(id) {
            editingItem=channels.find(c=>c.id===id);editingType='channel';
            document.getElementById('editTitle').textContent='✏️ Edit Channel';
            document.getElementById('editDeleteBtn').style.display='inline-flex';
            document.getElementById('editBody').innerHTML=`<div class="form-group"><label class="form-label">Name</label><input type="text" id="editName" class="form-input" value="${editingItem.name}"></div><div class="form-group"><label class="form-label">Handle</label><input type="text" id="editHandle" class="form-input" value="${editingItem.handle}"></div><div class="form-group"><label class="form-label">Description</label><textarea id="editDesc" class="form-input" rows="2">${editingItem.description||''}</textarea></div><div class="form-group"><label class="form-label">Avatar</label><input type="text" id="editAvatar" class="form-input" value="${editingItem.avatar||''}" dir="ltr"></div><div class="form-group"><label class="form-label">Banner</label><input type="text" id="editBanner" class="form-input" value="${editingItem.banner||''}" dir="ltr"></div>`;
            openModal('editModal');
        }
        function deleteChannel(id) { if(confirm('Delete this channel and all content?')){channels=channels.filter(c=>c.id!==id);videos=videos.filter(v=>v.channelId!==id);shorts=shorts.filter(v=>v.channelId!==id);lives=lives.filter(v=>v.channelId!==id);saveData();showHome();showToast('Channel deleted');} }

        // Content
        function handleAddVideo() {
            const type=document.getElementById('videoType').value;
            const ch=document.getElementById('videoChannel').value,t=document.getElementById('videoTitle').value.trim(),u=document.getElementById('videoUrl').value.trim();
            if(!ch||!t||!u)return showToast('Channel, title and URL required','error');
            const item={id:'v'+Date.now(),channelId:ch,title:t,url:u,category:document.getElementById('videoCategory').value,platform:document.getElementById('videoPlatform').value,thumbnail:document.getElementById('videoThumbnail').value.trim(),duration:document.getElementById('videoDuration').value.trim(),game:document.getElementById('videoGame').value.trim(),type:type,views:Math.floor(Math.random()*10000),viewers:Math.floor(Math.random()*5000),createdAt:Date.now()};
            if(type==='short')shorts.push(item);
            else if(type==='live')lives.push(item);
            else videos.push(item);
            saveData();closeModal('addVideoModal');render();showToast('Content added!');
        }
        function editContent(id,type) {
            const arr=type==='short'?shorts:type==='live'?lives:videos;
            editingItem=arr.find(v=>v.id===id);editingType=type;
            document.getElementById('editTitle').textContent='✏️ Edit '+(type==='short'?'Short':type==='live'?'Live':'Video');
            document.getElementById('editDeleteBtn').style.display='inline-flex';
            document.getElementById('editBody').innerHTML=`<div class="form-group"><label class="form-label">Channel</label><select id="editChannel" class="form-select">${channels.map(c=>`<option value="${c.id}"${c.id===editingItem.channelId?' selected':''}>${c.name}</option>`).join('')}</select></div><div class="form-group"><label class="form-label">Title</label><input type="text" id="editTitle" class="form-input" value="${editingItem.title}"></div><div class="form-group"><label class="form-label">URL</label><input type="text" id="editUrl" class="form-input" value="${editingItem.url}" dir="ltr"></div><div class="form-group"><label class="form-label">Thumbnail</label><input type="text" id="editThumbnail" class="form-input" value="${editingItem.thumbnail||''}" dir="ltr"></div><div class="form-group"><label class="form-label">Duration</label><input type="text" id="editDuration" class="form-input" value="${editingItem.duration||''}" dir="ltr"></div>${type==='live'?`<div class="form-group"><label class="form-label">Game</label><input type="text" id="editGame" class="form-input" value="${editingItem.game||''}"></div>`:''}`;
            openModal('editModal');
        }
        function deleteContent(id,type) {
            if(confirm('Delete this content?')){
                if(type==='short')shorts=shorts.filter(v=>v.id!==id);
                else if(type==='live')lives=lives.filter(v=>v.id!==id);
                else videos=videos.filter(v=>v.id!==id);
                saveData();render();showToast('Deleted');
            }
        }

        // Edit
        function saveEdit() {
            if(editingType==='channel'){editingItem.name=document.getElementById('editName').value;editingItem.handle=document.getElementById('editHandle').value;editingItem.description=document.getElementById('editDesc').value;editingItem.avatar=document.getElementById('editAvatar').value;editingItem.banner=document.getElementById('editBanner').value;}
            else{editingItem.channelId=document.getElementById('editChannel').value;editingItem.title=document.getElementById('editTitle').value;editingItem.url=document.getElementById('editUrl').value;editingItem.thumbnail=document.getElementById('editThumbnail').value;editingItem.duration=document.getElementById('editDuration').value;if(document.getElementById('editGame'))editingItem.game=document.getElementById('editGame').value;}
            saveData();closeModal('editModal');render();showToast('Saved!');
        }
        function deleteFromEdit() {
            if(editingType==='channel')deleteChannel(editingItem.id);
            else deleteContent(editingItem.id,editingType);
            closeModal('editModal');
        }

        // Admin
        function openAdmin() { openModal('adminModal'); renderAdminChannels(); }
        function switchAdminTab(t) {
            document.querySelectorAll('.admin-tab').forEach(x=>x.classList.remove('active'));
            document.getElementById('adminChannelsTab').style.display='none';
            document.getElementById('adminVideosTab').style.display='none';
            document.getElementById('adminUsersTab').style.display='none';
            if(t==='channels'){document.querySelectorAll('.admin-tab')[0].classList.add('active');document.getElementById('adminChannelsTab').style.display='block';renderAdminChannels();}
            else if(t==='videos'){document.querySelectorAll('.admin-tab')[1].classList.add('active');document.getElementById('adminVideosTab').style.display='block';renderAdminVideos();}
            else{document.querySelectorAll('.admin-tab')[2].classList.add('active');document.getElementById('adminUsersTab').style.display='block';renderAdminUsers();}
        }
        function renderAdminChannels() { document.getElementById('adminChannelsTab').innerHTML=channels.length?channels.map(c=>`<div class="admin-item"><div class="admin-item-left"><div class="channel-avatar">${getAvatar(c)}</div><div><div style="font-weight:500">${c.name}</div><div style="font-size:12px;color:var(--text-secondary)">${[...videos,...shorts,...lives].filter(v=>v.channelId===c.id).length} content</div></div></div><div><button class="btn btn-sm btn-ghost" onclick="closeModal('adminModal');editChannel('${c.id}')">✏️</button><button class="btn btn-sm btn-danger" onclick="deleteChannel('${c.id}');renderAdminChannels()">🗑️</button></div></div>`).join(''):'<div class="empty-state"><div class="empty-title">No channels</div></div>'; }
        function renderAdminVideos() {
            const all=[...videos.map(v=>({...v,_type:'video'})),...shorts.map(v=>({...v,_type:'short'})),...lives.map(v=>({...v,_type:'live'}))];
            document.getElementById('adminVideosTab').innerHTML=all.length?all.map(v=>`<div class="admin-item"><div class="admin-item-left"><div style="width:50px;height:28px;background:var(--bg-tertiary);border-radius:4px;overflow:hidden"><img src="${v.thumbnail||DEFAULT_THUMB}" style="width:100%;height:100%;object-fit:cover"></div><div><div style="font-weight:500;font-size:13px">${v.title.substring(0,30)}...</div><div style="font-size:11px;color:var(--text-secondary)">${channels.find(c=>c.id===v.channelId)?.name||'Unknown'} • ${v._type}</div></div></div><div><button class="btn btn-sm btn-ghost" onclick="closeModal('adminModal');editContent('${v.id}','${v._type}')">✏️</button><button class="btn btn-sm btn-danger" onclick="deleteContent('${v.id}','${v._type}');renderAdminVideos()">🗑️</button></div></div>`).join(''):'<div class="empty-state"><div class="empty-title">No content</div></div>';
        }
        function renderAdminUsers() { document.getElementById('adminUsersTab').innerHTML=users.map(u=>`<div class="admin-item"><div class="admin-item-left"><div class="user-avatar" style="background:${u.avatar?'transparent':u.color}">${u.avatar?`<img src="${u.avatar}">`:u.username[0].toUpperCase()}</div><div><div style="font-weight:500">${u.username} ${u.isAdmin?'<span class="badge badge-admin">Admin</span>':''} ${u.isBanned?'<span class="badge badge-banned">Banned</span>':''}</div><div style="font-size:12px;color:var(--text-secondary)">${formatDate(u.createdAt)}</div></div></div>${!u.isAdmin?`<button class="btn btn-sm ${u.isBanned?'btn-primary':'btn-danger'}" onclick="toggleBan('${u.id}')">${u.isBanned?'Unban':'Ban'}</button>`:''}</div>`).join(''); }
        function toggleBan(id) { const u=users.find(x=>x.id===id); if(u){u.isBanned=!u.isBanned;saveData();renderAdminUsers();showToast(u.isBanned?'Banned':'Unbanned');} }

        // Modal
        const openModal=id=>document.getElementById(id).classList.add('active');
        const closeModal=id=>{document.getElementById(id).classList.remove('active');if(id==='editModal'){editingItem=null;editingType=null;}};
        const openAddVideoFor=chId=>{document.getElementById('videoChannel').innerHTML='<option value="">Select...</option>'+channels.map(c=>`<option value="${c.id}"${c.id===chId?' selected':''}>${c.name}</option>`).join('');openModal('addVideoModal');};

        // Search
        function handleSearch() {
            const q=document.getElementById('searchInput').value.trim().toLowerCase();
            if(!q)return;
            const all=[...videos,...shorts,...lives];
            const r=all.filter(v=>v.title.toLowerCase().includes(q));
            document.getElementById('pageContent').innerHTML=`<h1 style="font-size:24px;margin-bottom:20px">🔍 Results for "${q}"</h1>`+(r.length?`<div class="video-grid">${r.map(v=>v.type==='short'?shortCard(v):v.type==='live'?liveCard(v):videoCard(v)).join('')}</div>`:'<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-title">No results</div></div>');
        }

        // Events
        document.addEventListener('DOMContentLoaded',init);
        document.addEventListener('keydown',e=>{if(e.key==='Escape'){['authModal','addChannelModal','addVideoModal','adminModal','editModal'].forEach(closeModal);}});
    </script>
</body>
</html>
